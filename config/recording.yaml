# Final map/pose playback. No remote LiDAR, IMU, or intermediate clouds.
purpose: results
robots: [r0, r1]
per_robot:
  pose_required:
    - {topic: '/multi_agent/{robot}/aligned_odometry', type: nav_msgs/msg/Odometry}
  reference:
    - {topic: '/multi_agent/{robot}/global_pose', type: geometry_msgs/msg/PoseWithCovarianceStamped}
    - {topic: '/multi_agent/{robot}/aligned_path', type: nav_msgs/msg/Path}
shared:
  results_required:
    - {topic: /multi_agent/merged_global_occupancy, type: nav_msgs/msg/OccupancyGrid, latched: true}
  reference:
    - {topic: /tf, type: tf2_msgs/msg/TFMessage, depth: 400}
    - {topic: /tf_static, type: tf2_msgs/msg/TFMessage, latched: true, reliable: true, depth: 100}
    - {topic: /multi_agent/map_status, type: diagnostic_msgs/msg/DiagnosticArray, latched: true}
single_agent:
  per_robot:
    results_required:
      - {topic: '/{robot}/mapping/global_occupancy', type: nav_msgs/msg/OccupancyGrid}
    pose_required:
      - {topic: '/{robot}/mapping/occupancy_mapper_odometry', type: nav_msgs/msg/Odometry}
    reference:
      - {topic: '/{robot}/mapping/debug/local_submap_corrected_odometry_path', type: nav_msgs/msg/Path}
sensor_static_frames:
  - [r0/base_link, r0/livox_frame]
  - [r1/base_link, r1/livox_frame]
