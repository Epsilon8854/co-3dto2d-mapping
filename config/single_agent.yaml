# Shared mapping parameters. Robot-specific topics/frames are generated from robot_id.
/**:
  ros__parameters:
    # Full XY square side length around base_link; 0 disables exclusion.
    robot_body_exclusion_box_size_m: 1.6
    corrected_odometry_topic: mapping/occupancy_mapper_odometry
    dynamic_filter_enabled: false
    dynamic_free_clear_count: 30
    enable_raycast_free_space: true
    use_odom_header_frame: false
    global_map_padding_m: 5.0
    grid_resolution: 0.05
    invert_z_slice: false
    local_line_pht_max_contiguous_gap_m: 0.15
    local_line_pht_max_gap_m: 0.1
    local_line_pht_min_length_m: 0.7
    local_line_pht_min_occupied_support_ratio: 0.7
    local_map_size_m: 20.0
    local_pht_submap_apply_frame: -1
    local_pht_submap_apply_source_line: -1
    local_pht_submap_apply_target_line: -1
    local_pht_submap_diagnostics_csv_path: ''
    local_pht_submap_history_keyframes: 5
    local_pht_submap_keyframe_translation_m: 0.5
    local_pht_submap_keyframe_yaw_deg: 5.0
    local_pht_submap_max_angle_deg: 10.0
    local_pht_submap_max_normal_distance_m: 0.35
    local_pht_submap_min_overlap_m: 0.5
    local_pht_submap_pose_graph_enabled: true
    local_pht_submap_pose_graph_mode: full_se2
    local_pht_submap_visualization_dir: ''
    local_pht_submap_weight: 0.2
    log_z_slice_stats: false
    occupied_threshold_points: 1
    publish_corrected_odometry: true
    publish_period_ms: 200
    pipeline_metrics_enabled: true
    pipeline_metrics_period_ms: 1000
    publish_slice_debug_points: true
    range_max_m: 12.0
    range_min_m: 0.8
    raycast_clear_occupied: false
    raycast_free_value: 0
    raycast_max_range_m: 12.0
    raycast_min_range_m: 0.8
    raycast_occupied_value: 100
    raycast_unknown_value: -1
    slice_debug_points_max_points: 80000
    slice_in_global_frame: false
    slice_z_in_cloud_frame: true
    sync_queue_size: 100
    transform_cloud_to_local_frame: true
    z_max: 1000.0
    z_min: -1000.0
    dynamic_evidence_timeout_sec: 5.0
    dynamic_clear_max_range_m: 6.0
    mapping_log_period_ms: 2000
    pose_correction_enabled: true
    height_filter_enabled: true
    gravity_source: orientation_then_acceleration
    imu_timeout_sec: 0.3
    acceleration_min_mps2: 6.0
    acceleration_max_mps2: 13.0
    acceleration_blend: 0.15
    gravity_filter_gain: 0.25
    gravity_hold_timeout_sec: 0.75
    gravity_sync_queue_size: 30
    gravity_sync_slop_sec: 0.08
    height_filter_min_m: 0.3
    height_filter_max_m: 1.2
    filtered_cloud_min_points: 20
    orientation_stddev_rad: 0.03
    debug_paths_enabled: true
    debug_path_max_poses: 10000
    debug_path_publish_period_ms: 250
    lidar_mount_height_above_floor_m: 0.3
    fixed_base_link_height_above_floor_m: 0.3
