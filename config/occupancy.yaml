/**:
  ros__parameters:
    scan_cloud_topic: "/livox/lidar"
    odom_topic: "mapping/floor_odometry"
    local_frame_id: "base_link"
    global_frame_id: "odom"
    grid_resolution: 0.05
    local_map_size_m: 20.0

    # The mapper receives a cloud already selected by signed height above the
    # shared floor plane. The legacy fixed-Z slice is therefore pass-through.
    z_min: -1000.0
    z_max: 1000.0
    slice_in_global_frame: false
    slice_z_in_cloud_frame: true
    invert_z_slice: false
    log_z_slice_stats: false
    publish_slice_debug_points: true
    slice_debug_points_max_points: 80000
    transform_cloud_to_local_frame: true
    center_box_filter_half_extent_m: 0.80
    range_min_m: 0.80
    range_max_m: 12.0
    enable_raycast_free_space: true
    raycast_free_value: 0
    raycast_occupied_value: 100
    raycast_unknown_value: -1
    raycast_max_range_m: 12.0
    raycast_min_range_m: 0.80
    raycast_clear_occupied: false
    occupied_threshold_points: 1

    # Temporal occupied/free evidence is frame based. Each grid cell contributes
    # at most one free/occupied observation per mapping frame, so dense scans do
    # not clear a cell immediately. Time-based evidence remains a later ablation.
    dynamic_filter_enabled: true
    dynamic_free_clear_count: 4
    dynamic_occupied_confirm_count: 3
    dynamic_counter_decay: 1
    dynamic_evidence_timeout_frames: 30

    # Scan-to-submap ICP refines only x/y/yaw. The input odometry already carries
    # the shared floor-derived z/roll/pitch when ground_plane_pose_enabled=true.
    enable_local_window_icp: true
    icp_window_size: 10
    icp_min_window_frames: 3
    icp_voxel_size_m: 0.12
    icp_min_source_points: 80
    icp_max_source_points: 1200
    icp_max_submap_points: 8000
    icp_max_iterations: 12
    icp_max_correspondence_distance_m: 0.45
    icp_min_correspondences: 50
    icp_min_overlap_ratio: 0.20
    icp_trim_ratio: 0.75
    icp_max_rmse_m: 0.20
    icp_max_rmse_increase_m: 0.01
    icp_correction_gain: 0.70
    icp_max_correction_translation_m: 0.35
    icp_max_correction_yaw_deg: 8.0
    icp_reset_translation_jump_m: 1.50
    icp_reset_yaw_jump_deg: 35.0
    icp_coarse_translation_range_m: 0.10
    icp_coarse_translation_step_m: 0.05
    icp_coarse_rotation_range_deg: 3.0
    icp_coarse_rotation_step_deg: 1.0
    icp_log_period_ms: 2000
    publish_corrected_odometry: true
    corrected_odometry_topic: "toy/corrected_odometry"

    # Single-floor shared-state front end.
    #
    # raw cloud + IMU + raw odom -> one floor observation
    #   -> mapping/plane_height_filtered
    #   -> mapping/floor_odometry
    # Both outputs have the raw cloud stamp and the occupancy mapper consumes
    # both. Set ground_plane_pose_enabled=false to pass raw odometry through on
    # mapping/floor_odometry while keeping exactly the same filtered cloud.
    ground_plane_pose_enabled: true
    ground_plane_pointcloud_topic: "/livox/lidar"
    ground_plane_imu_topic: "/livox/imu_filtered"
    ground_plane_planar_odometry_topic: "odom"
    ground_plane_output_odometry_topic: "mapping/floor_odometry"
    ground_plane_local_frame_id: "base_link"

    ground_plane_height_filter_enabled: true
    ground_plane_filtered_cloud_topic: "mapping/plane_height_filtered"
    ground_plane_filter_min_height_m: 0.05
    ground_plane_filter_max_height_m: 1.00
    ground_plane_filtered_cloud_min_points: 20
    ground_plane_filtered_cloud_log_period_ms: 2000

    # The default assumes one approximately horizontal floor. The IMU fixes the
    # plane normal and a robust 1-D mode search estimates only the floor offset.
    # ransac preserves the previous gravity-constrained 3-D fit for ablations.
    ground_plane_estimation_mode: "single_floor"
    ground_plane_single_floor_bin_size_m: 0.025
    ground_plane_single_floor_lowest_support_ratio: 0.55
    ground_plane_single_floor_prior_tolerance_m: 0.15

    # orientation: world-up from the filtered IMU quaternion
    # acceleration: normalized accelerometer specific force (+g at rest)
    # orientation_then_acceleration: preferred default with acceleration fallback
    # blend: blend both directions when both are valid
    ground_plane_gravity_source: "orientation_then_acceleration"
    ground_plane_imu_timeout_sec: 0.30
    ground_plane_acceleration_min_mps2: 6.0
    ground_plane_acceleration_max_mps2: 13.0
    ground_plane_acceleration_blend: 0.15
    ground_plane_sync_queue_size: 30
    ground_plane_sync_slop_sec: 0.08

    # Candidate points are selected in a gravity-aligned local coordinate system.
    # Ground is below the base origin, hence the negative signed-height interval.
    ground_plane_candidate_min_range_m: 0.30
    ground_plane_candidate_max_range_m: 6.0
    ground_plane_candidate_height_min_m: -2.5
    ground_plane_candidate_height_max_m: -0.05
    ground_plane_candidate_center_exclusion_m: 0.25
    ground_plane_max_points: 4000

    # Used only when ground_plane_estimation_mode="ransac". The tighter normal
    # gate encodes the same flat, single-floor assumption.
    ground_plane_ransac_iterations: 80
    ground_plane_distance_threshold_m: 0.04
    ground_plane_max_normal_deviation_deg: 8.0
    ground_plane_min_inliers: 80
    ground_plane_min_inlier_ratio: 0.08
    ground_plane_min_height_m: 0.05
    ground_plane_max_height_m: 2.5
    ground_plane_lowest_score_weight: 0.03
    ground_plane_random_seed: 7

    # One shared temporal state feeds both filtering and pose fusion. Short holds
    # bridge sparse scans without fitting the same raw cloud twice.
    ground_plane_filter_gain: 0.25
    ground_plane_max_height_jump_m: 0.15
    ground_plane_max_tilt_jump_deg: 6.0
    ground_plane_hold_timeout_sec: 0.75
    ground_plane_state_reset_timeout_sec: 3.0

    # Under the single-floor assumption, height_above_plane gives the base height
    # in the floor-fixed world. relative_to_initial and passthrough remain for
    # controlled ablations.
    ground_plane_z_mode: "height_above_plane"
    ground_plane_reference_z_m: 0.0
    ground_plane_z_offset_m: 0.0
    ground_plane_z_stddev_min_m: 0.02
    ground_plane_orientation_stddev_rad: 0.03
    ground_plane_log_period_ms: 2000

    publish_period_ms: 200
    global_map_padding_m: 5.0
    sync_queue_size: 100

# The side-by-side live startup aligner runs before odometry. It therefore uses
# the raw 3-D LiDAR clouds and reads its crop/range/ICP settings from this same
# file. The mapper's old inverse-Z slice must not be repeated here: both the
# explicit z filter and invert_z_slice are disabled. The launch also enforces
# those two values as a safety fallback for older custom YAML files.
/initial_xy_icp_alignment:
  ros__parameters:
    use_z_filter: false
    slice_z_in_cloud_frame: true
    z_min: -1000.0
    z_max: 1000.0
    invert_z_slice: false

    center_box_half_extent_m: 0.80
    range_min_m: 0.80
    range_max_m: 12.0
    voxel_size: 0.10
    max_points: 15000
    max_correspondence_distance: 0.75
    min_correspondences: 100
    min_fitness: 0.05
    max_rmse: 0.40
    max_iterations: 40
    recompute_period_sec: 5.0
    frame_count: 5
    invert_result: false
    lock_after_first_alignment: true
    required_consistent_results: 2
    max_consistency_translation_m: 0.25
    max_consistency_rotation_rad: 0.08726646259971647
    initialize_from_centroids: true

    # The README requires both robots to start side-by-side with the same
    # heading, so reject the common 180-degree symmetric solution.
    enforce_heading_prior: true
    expected_yaw_rad: 0.0
    max_yaw_deviation_rad: 1.5707963267948966
    initial_yaw_offsets_rad: [0.0, -0.5235987755982988, 0.5235987755982988]
    max_iteration_rotation_rad: 1.0471975511965976
    heading_prior_weight: 0.05
    enforce_tilt_prior: true
    max_tilt_deviation_rad: 0.2617993877991494
