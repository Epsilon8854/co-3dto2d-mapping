/**:
  ros__parameters:
    scan_cloud_topic: "/livox/lidar"
    odom_topic: "odom"
    local_frame_id: "base_link"
    global_frame_id: "odom"
    grid_resolution: 0.05
    local_map_size_m: 20.0

    # Legacy fixed-Z slicing is intentionally pass-through in the default
    # pipeline. gravity_plane_pose_fusion.py publishes an already filtered
    # cloud using signed height above the detected ground plane.
    z_min: -1000.0
    z_max: 1000.0
    slice_in_global_frame: false
    slice_z_in_cloud_frame: true
    invert_z_slice: false
    log_z_slice_stats: false
    publish_slice_debug_points: true
    slice_debug_points_max_points: 80000
    transform_cloud_to_local_frame: true
    center_box_filter_half_extent_m: 0.80
    range_min_m: 0.80
    range_max_m: 12.0
    enable_raycast_free_space: true
    raycast_free_value: 0
    raycast_occupied_value: 100
    raycast_unknown_value: -1
    raycast_max_range_m: 12.0
    raycast_min_range_m: 0.80
    raycast_clear_occupied: false
    occupied_threshold_points: 1

    # Temporal occupancy evidence. A cell is cleared only after free space is
    # observed in this many different mapping frames. A previously free cell
    # also needs repeated occupied frames before a new obstacle is committed.
    dynamic_filter_enabled: true
    dynamic_free_clear_count: 4
    dynamic_occupied_confirm_count: 3
    dynamic_counter_decay: 1
    dynamic_evidence_timeout_frames: 30

    # Scan-to-submap ICP. The current plane-filtered scan is matched against a
    # submap made from the most recent corrected frames; raw odometry supplies
    # the initial motion estimate and remains the fallback on quality failure.
    enable_local_window_icp: true
    icp_window_size: 10
    icp_min_window_frames: 3
    icp_voxel_size_m: 0.12
    icp_min_source_points: 80
    icp_max_source_points: 1200
    icp_max_submap_points: 8000
    icp_max_iterations: 12
    icp_max_correspondence_distance_m: 0.45
    icp_min_correspondences: 50
    icp_min_overlap_ratio: 0.20
    icp_trim_ratio: 0.75
    icp_max_rmse_m: 0.20
    icp_max_rmse_increase_m: 0.01
    icp_correction_gain: 0.70
    icp_max_correction_translation_m: 0.35
    icp_max_correction_yaw_deg: 8.0
    icp_reset_translation_jump_m: 1.50
    icp_reset_yaw_jump_deg: 35.0
    icp_coarse_translation_range_m: 0.10
    icp_coarse_translation_step_m: 0.05
    icp_coarse_rotation_range_deg: 3.0
    icp_coarse_rotation_step_deg: 1.0
    icp_log_period_ms: 2000
    publish_corrected_odometry: true

    # The occupancy mapper produces the planar x/y/yaw estimate on this
    # intermediate topic. gravity_plane_pose_fusion.py adds z/roll/pitch and
    # publishes the final pose on toy/corrected_odometry.
    corrected_odometry_topic: "toy/planar_odometry"

    # Gravity-constrained ground-plane pose fusion. x/y/yaw are copied from
    # toy/planar_odometry. z/roll/pitch are estimated from a horizontal plane
    # whose normal must remain close to the IMU-derived up direction.
    ground_plane_pose_enabled: true
    ground_plane_pointcloud_topic: "/livox/lidar"
    ground_plane_imu_topic: "/livox/imu_filtered"
    ground_plane_planar_odometry_topic: "toy/planar_odometry"
    ground_plane_output_odometry_topic: "toy/corrected_odometry"
    ground_plane_local_frame_id: "base_link"

    # This is the active mapping-height filter. The output contains points
    # between 5 cm and exactly 1.00 m above the detected plane. No fixed sensor
    # Z interval and no invert_z logic is used by the default mapper path.
    ground_plane_height_filter_enabled: true
    ground_plane_filtered_cloud_topic: "mapping/plane_height_filtered"
    ground_plane_filter_min_height_m: 0.05
    ground_plane_filter_max_height_m: 1.00
    ground_plane_filtered_cloud_min_points: 20
    ground_plane_filtered_cloud_log_period_ms: 2000

    # orientation: world-up from the filtered IMU quaternion
    # acceleration: normalized accelerometer specific force (+g at rest)
    # orientation_then_acceleration: preferred default with acceleration fallback
    # blend: blend both directions when both are valid
    ground_plane_gravity_source: "orientation_then_acceleration"
    ground_plane_imu_timeout_sec: 0.30
    ground_plane_acceleration_min_mps2: 6.0
    ground_plane_acceleration_max_mps2: 13.0
    ground_plane_acceleration_blend: 0.15
    ground_plane_sync_queue_size: 30
    ground_plane_sync_slop_sec: 0.08

    # Candidate points are selected in a gravity-aligned local coordinate
    # system. Height values are signed along up; ground is normally negative.
    ground_plane_candidate_min_range_m: 0.30
    ground_plane_candidate_max_range_m: 6.0
    ground_plane_candidate_height_min_m: -2.5
    ground_plane_candidate_height_max_m: -0.05
    ground_plane_candidate_center_exclusion_m: 0.25
    ground_plane_max_points: 4000

    ground_plane_ransac_iterations: 120
    ground_plane_distance_threshold_m: 0.04
    ground_plane_max_normal_deviation_deg: 18.0
    ground_plane_min_inliers: 80
    ground_plane_min_inlier_ratio: 0.08
    ground_plane_min_height_m: 0.05
    ground_plane_max_height_m: 2.5
    ground_plane_lowest_score_weight: 0.03
    ground_plane_random_seed: 7

    # Temporal gates prevent a table top, a sparse frame, or an IMU spike from
    # abruptly changing z/roll/pitch or the mapping-height filter. A short hold
    # bridges temporary plane-fitting dropouts.
    ground_plane_filter_gain: 0.25
    ground_plane_max_height_jump_m: 0.20
    ground_plane_max_tilt_jump_deg: 10.0
    ground_plane_hold_timeout_sec: 0.75
    ground_plane_state_reset_timeout_sec: 3.0

    # height_above_plane: z = reference plane z + measured base height + offset
    # relative_to_initial: preserve initial odom z and use plane-height changes
    # passthrough: retain planar odometry z while still replacing roll/pitch
    ground_plane_z_mode: "height_above_plane"
    ground_plane_reference_z_m: 0.0
    ground_plane_z_offset_m: 0.0
    ground_plane_z_stddev_min_m: 0.02
    ground_plane_orientation_stddev_rad: 0.03
    ground_plane_log_period_ms: 2000

    publish_period_ms: 200
    global_map_padding_m: 5.0
    sync_queue_size: 100
