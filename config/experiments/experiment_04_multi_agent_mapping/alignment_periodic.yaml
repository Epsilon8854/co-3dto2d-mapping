# Opt-in periodic alignment; world anchor/native odometry are preserved.
# Source history is reprojected before a transform revision is published.
/**:
  ros__parameters:
    world_frame: map
    pose_relay_pose_timeout_sec: 2.0
    pose_relay_tf_wait_timeout_sec: 1.0
    mode: auto_validated_locked
    confirmation_windows: 1
    consensus_translation_m: 0.1
    consensus_yaw_deg: 0.5
    stationary_translation_m: 0.15
    stationary_yaw_deg: 2.0
    input_timeout_sec: 5.0
    submap_radius_m: 12.0
    registration_resolution_m: 0.1
    output_resolution_m: 0.05
    merged_period_sec: 0.5
    checkpoint_sec: 10.0
    max_grid_cells: 16000000
    require_sessions: true
    manual_x_m: 0.0
    manual_y_m: 0.0
    manual_yaw_deg: 0.0
    registration.coarse_translation_range_m: 2.5
    registration.coarse_translation_step_m: 0.25
    registration.search_max_points: 700
    registration.min_correspondences: 80
    registration.min_symmetric_overlap: 0.3
    registration.max_symmetric_rmse_m: 0.25
    registration.max_free_conflict_ratio: 0.18
    search.coarse_yaw_step_deg: 5.0
    search.top_candidates: 5
    search.min_score_gap_ratio: 0.1
    search.min_observability_ratio: 0.001
    startup_accumulation_sec: 3.0
    verification_interval_sec: 1.0
    local_queue_size: 100
    path_publish_period_sec: 1.0
    path_max_poses: 5000
    verification_prior_growth_ratio: 0.25
    verification_translation_range_m: 0.15
    merged_dynamic_filter_enabled: true
    merged_dynamic_free_clear_count: 30
    merged_dynamic_evidence_timeout_sec: 5.0
    merged_dynamic_observation_bin_sec: 0.1
    merged_dynamic_clear_max_range_m: 6.0
    periodic.enabled: true
    periodic.interval_sec: 2.0
    periodic.source_window_sec: 3.0
    periodic.radius_m: 8.0
    periodic.resolution_m: 0.1
    periodic.max_input_age_sec: 5.0
    periodic.max_translation_m: 0.3
    periodic.max_yaw_deg: 3.0
    periodic.correction_gain: 0.5
    periodic.min_relative_improvement: 0.02
    periodic.min_observability: 0.005
    periodic.journal_max_mb: 2048.0
    periodic.max_reprojection_sec: 4.0
