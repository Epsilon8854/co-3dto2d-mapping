/**:
  ros__parameters:
    scan_cloud_topic: /livox/lidar
    odom_topic: mapping/floor_based_odometry
    local_frame_id: base_link
    global_frame_id: odom
    grid_resolution: 0.05
    local_map_size_m: 20.0
    z_min: -1000.0
    z_max: 1000.0
    slice_in_global_frame: false
    slice_z_in_cloud_frame: true
    invert_z_slice: false
    log_z_slice_stats: false
    publish_slice_debug_points: true
    slice_debug_points_max_points: 80000
    transform_cloud_to_local_frame: true
    center_box_filter_half_extent_m: 2.5
    range_min_m: 0.8
    range_max_m: 12.0
    enable_raycast_free_space: true
    raycast_free_value: 0
    raycast_occupied_value: 100
    raycast_unknown_value: -1
    raycast_max_range_m: 12.0
    raycast_min_range_m: 0.8
    raycast_clear_occupied: false
    occupied_threshold_points: 1
    dynamic_filter_enabled: false
    dynamic_free_clear_count: 20
    dynamic_occupied_confirm_count: 1
    dynamic_counter_decay: 1
    dynamic_evidence_timeout_frames: 3000
    merged_free_observation_inflation_m: 0.0
    enable_local_window_icp: false
    icp_window_size: 10
    icp_min_window_frames: 3
    icp_voxel_size_m: 0.12
    icp_min_source_points: 80
    icp_max_source_points: 1200
    icp_max_submap_points: 8000
    icp_max_iterations: 12
    icp_max_correspondence_distance_m: 0.45
    icp_min_correspondences: 50
    icp_min_overlap_ratio: 0.2
    icp_trim_ratio: 0.75
    icp_max_rmse_m: 0.2
    icp_max_rmse_increase_m: 0.01
    icp_correction_gain: 0.7
    icp_max_correction_translation_m: 0.35
    icp_max_correction_yaw_deg: 8.0
    icp_reset_translation_jump_m: 1.5
    icp_reset_yaw_jump_deg: 35.0
    icp_coarse_translation_range_m: 0.1
    icp_coarse_translation_step_m: 0.05
    icp_coarse_rotation_range_deg: 3.0
    icp_coarse_rotation_step_deg: 1.0
    icp_log_period_ms: 2000
    publish_corrected_odometry: true
    corrected_odometry_topic: mapping/occupancy_mapper_odometry
    ground_plane_pose_enabled: true
    # No LiDAR plane fit: keep base_link at its configured floor-relative height
    # and align roll/pitch from the filtered IMU gravity direction.
    ground_plane_pose_reference_mode: fixed_height_imu_gravity
    fixed_base_link_height_above_floor_m: 0.30
    ground_plane_pointcloud_topic: /livox/lidar
    ground_plane_imu_topic: /livox/imu_filtered
    ground_plane_planar_odometry_topic: odom
    ground_plane_output_odometry_topic: mapping/floor_based_odometry
    ground_plane_local_frame_id: base_link
    ground_plane_height_filter_enabled: true
    # Floor returns are not visible from the task mounting position. Use the
    # measured mounting height and IMU gravity rather than fitting a cloud plane.
    ground_plane_height_reference_mode: fixed_sensor_height
    lidar_mount_height_above_floor_m: 0.30
    ground_plane_filtered_cloud_topic: mapping/plane_height_filtered
    # Keep obstacles 0.30--1.20 m above the physical floor. With the sensor
    # at 0.30 m, this is the gravity-aligned sensor band 0.00--0.90 m.
    ground_plane_filter_min_height_m: 0.30
    ground_plane_filter_max_height_m: 1.20
    ground_plane_filtered_cloud_min_points: 20
    ground_plane_filtered_cloud_log_period_ms: 2000
    ground_plane_estimation_mode: single_floor
    ground_plane_single_floor_bin_size_m: 0.025
    ground_plane_single_floor_lowest_support_ratio: 0.55
    ground_plane_single_floor_prior_tolerance_m: 0.15
    ground_plane_gravity_source: orientation_then_acceleration
    ground_plane_imu_timeout_sec: 0.3
    ground_plane_acceleration_min_mps2: 6.0
    ground_plane_acceleration_max_mps2: 13.0
    ground_plane_acceleration_blend: 0.15
    ground_plane_sync_queue_size: 30
    ground_plane_sync_slop_sec: 0.08
    ground_plane_candidate_min_range_m: 0.3
    ground_plane_candidate_max_range_m: 6.0
    ground_plane_candidate_height_min_m: -2.5
    ground_plane_candidate_height_max_m: -0.05
    ground_plane_candidate_center_exclusion_m: 0.25
    ground_plane_max_points: 4000
    ground_plane_ransac_iterations: 80
    ground_plane_distance_threshold_m: 0.04
    ground_plane_max_normal_deviation_deg: 8.0
    ground_plane_min_inliers: 80
    ground_plane_min_inlier_ratio: 0.08
    ground_plane_min_height_m: 0.05
    ground_plane_max_height_m: 2.5
    ground_plane_lowest_score_weight: 0.03
    ground_plane_random_seed: 7
    ground_plane_filter_gain: 0.25
    ground_plane_max_height_jump_m: 0.15
    ground_plane_max_tilt_jump_deg: 6.0
    ground_plane_hold_timeout_sec: 0.75
    ground_plane_state_reset_timeout_sec: 3.0
    ground_plane_z_mode: height_above_plane
    ground_plane_reference_z_m: 0.0
    ground_plane_z_offset_m: 0.0
    ground_plane_z_stddev_min_m: 0.02
    ground_plane_orientation_stddev_rad: 0.03
    ground_plane_log_period_ms: 2000
    publish_period_ms: 200
    global_map_padding_m: 5.0
    sync_queue_size: 100
    # No observed floor exists in this reference mode, so there are no plane
    # inliers to display.
    ground_plane_debug_cloud_enabled: false
    ground_plane_debug_cloud_topic: mapping/debug/ground_plane_inliers
    ground_plane_debug_raw_path_topic: mapping/debug/raw_odometry_path
    ground_plane_debug_fused_path_topic: mapping/debug/floor_based_odometry_path
    ground_plane_debug_path_max_poses: 10000
    ground_plane_debug_path_publish_period_ms: 250
    ground_plane_debug_paths_enabled: true
    # Experiment 2: occupancy-boundary current patch to frozen local submap.
    local_submap_registration_enabled: false
    local_pose_graph_enabled: false
    local_line_pose_graph_enabled: true
    local_submap_registration_radius_m: 10.0
    # Exclude consecutive scans: only an earlier, spatially separated patch
    # can anchor this update.
    local_submap_keyframe_translation_m: 0.50
    local_submap_keyframe_yaw_deg: 5.0
    # Line features from local occupancy boundaries, then line-factor pose graph.
    local_line_pose_graph_window_size: 30
    local_line_pose_graph_keyframe_translation_m: 0.50
    local_line_pose_graph_keyframe_yaw_deg: 5.0
    local_line_pose_graph_candidate_min_distance_m: 1.0
    local_line_pose_graph_candidate_radius_m: 10.0
    local_line_pose_graph_max_scan_constraints: 2
    local_line_pose_graph_scan_weight: 0.20
    local_line_pose_graph_visualization_dir: ""
    local_line_pose_graph_visualization_period_frames: 1
    local_line_pose_graph_diagnostics_csv_path: ""
    # PHT is extraction-only in this profile. Compare it against the existing
    # RANSAC lines before enabling it as a pose-graph factor source.
    local_line_pht_enabled: true
    local_line_pht_min_length_m: 1.50
    local_line_pht_max_gap_m: 0.10
    local_line_pht_max_contiguous_gap_m: 0.15
    local_line_pht_min_occupied_support_ratio: 0.70
    local_submap_diagnostics_csv_path: ""
